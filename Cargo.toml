[package]
name = "flick-tui"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Terminal client for flick — RSVP speed reading in your terminal"
repository = "https://github.com/one-more-refactor/flick-tui"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
